# Feedra Nginx Production Configuration
# Copy this file to /etc/nginx/sites-available/feedra on your production server

upstream feedra_api_nodes {
    least_conn; # Load balancing algorithm: Routes to instance with least active connections
    server 127.0.0.1:5001; # Backend Node Instance 1
    # server 127.0.0.1:5002; # Backend Node Instance 2 (Uncomment when scaling horizontally)
    # server 127.0.0.1:5003; # Backend Node Instance 3 (Uncomment when scaling horizontally)
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost; # Replace with your domain (e.g., feedra.org or api.feedra.org)

    # Gzip Compression to speed up asset load times
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_min_length 1000;

    # ---------------- 1. SERVE FRONTEND STATIC ASSETS ----------------
    location / {
        # Root directory points to the compiled Vite dist folder
        root /var/www/feedra/feedraanti/dist;
        index index.html;
        try_files $uri $uri/ /index.html; # React router fallback
    }

    # Cache static assets (JS, CSS, Images) heavily
    location /assets/ {
        root /var/www/feedra/feedraanti/dist;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # ---------------- 2. REVERSE PROXY FOR BACKEND API ----------------
    location /api/ {
        proxy_pass http://feedra_api_nodes/; # Forward to our upstream cluster
        
        # Security & Identity Headers (Crucial for Express 'trust proxy' setting)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets Connection Support (For real-time snapshots fallback)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
